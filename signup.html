<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seller Sign Up</title>

  <!-- Login / Signup CSS -->
  <link rel="stylesheet" href="css/signup-login.css">
</head>

<body>

  <div class="card">
    <h2>Create Seller Account</h2>

    <!-- ❌ onsubmit hata diya -->
    <form id="signupForm">

      <input id="name" type="text" placeholder="Full Name" required>
      <input id="email" type="email" placeholder="Email Address" required>
      <input id="phone" type="text" placeholder="Phone Number" required>
      <input id="whatsapp" type="text" placeholder="WhatsApp Number" required>
      <input id="city" type="text" placeholder="City / Location" required>


      <input id="password" type="password" placeholder="Password" required>
      <input id="confirmPassword" type="password" placeholder="Confirm Password" required>

      <div class="row">
        <!-- ❌ onclick hata diya -->
        <button type="submit" class="btn btn-success">Create Account</button>
      </div>

      <p id="message" class="message"></p>
    </form>

    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>

  <!-- MAIN JS FILE -->
  <script src="js/script.js" defer></script>
  <!-- agar js folder na ho to:
  <script src="script.js" defer></script>
  -->

</body>
</html>
