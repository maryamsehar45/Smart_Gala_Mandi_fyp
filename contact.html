<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Gala Mandi - Contact Us</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>  
<body>

  <!-- ===== HEADER ===== -->
   <header class="site-header">
  <div class="site-header-inner">
    <div class="logo">
      <img src="assets/logo.png" alt="Smart Gala Mandi Logo">
      <div class="logo-text">Smart Gala Mandi</div>
    </div>

    <div class="menu-toggle">
      <i class="fas fa-bars"></i>
    </div>

    <nav class="nav">
      <a href="index.html" class="active">Home</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
    </nav>

    <div class="header-actions">
      <a href="login.html" class="cta-button">Login</a>
      <div class="lang-btn">Eng /اردو</div>
    </div>
  </div>
</header>

  <!-- ===== CONTACT SECTION ===== -->
  <section class="contact-section">
    <div class="contact-content">
      
      <!-- ===== LEFT IMAGE SIDE ===== -->
      <div class="contact-image">
        <div class="circle"></div>
        <img src="assets/pic.png" alt="Contact Smart Gala Mandi" />
      </div>

      <!-- ===== RIGHT TEXT SIDE ===== -->
      <div class="contact-text">
        <h2>Contact Us</h2>
        <p>
          Have a question or need support? Smart Gala Mandi is here to help you.  
          Whether you’re a farmer, trader, or buyer — we ensure smooth communication  
          and assistance at every step.
        </p>
        <form class="contact-form">
          <input type="text" placeholder="Your Name" required>
          <input type="email" placeholder="Your Email" required>
          <textarea rows="5" placeholder="Your Message" required></textarea>
          <button type="submit" class="btn">Send Message</button>
        </form>
      </div>

    </div>
  </section>

 <footer>
  <div class="footer-inner">
    <p>© 2025 Smart Gala Mandi | All Rights Reserved</p>
  </div>
</footer>

</body>

</html>
