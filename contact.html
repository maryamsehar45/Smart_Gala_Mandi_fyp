  <section style="padding:50px; text-align:center;">

      <input type="text" style="width:300px; padding:8px;"><br><br>
      <label>Email:</label><br>

      <label>Message:</label><br>
      <textarea rows="5" style="width:300px; padding:8px;"></textarea><br><br>
      <button class="btn green" type="submit">Send</button>
    </form>
  </section>
