<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seller Sign Up</title>

  <!-- CSS (Flask static fix) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/signup-login.css') }}">
</head>

<body>

  <div class="card">
    <h2>Create Seller Account</h2>

    <!-- Flask POST route -->
    <form method="POST" action="{{ url_for('signup') }}">

      <input name="name" type="text" placeholder="Full Name" required>

      <input name="email" type="email" placeholder="Email Address" required>

      <input name="phone" type="text" placeholder="Phone Number" required>

      <input name="whatsapp" type="text" placeholder="WhatsApp Number" required>

      <input name="city" type="text" placeholder="City / Location" required>

      <input name="password" type="password" placeholder="Password" required>

      <input name="confirmPassword" type="password" placeholder="Confirm Password" required>

      <div class="row">
        <button type="submit" class="btn btn-success">
          Create Account
        </button>
      </div>

      <p id="message" class="message"></p>

    </form>

    <p>
      Already have an account?
      <a href="{{ url_for('login') }}">Login</a>
    </p>
  </div>

  <!-- JS -->
  <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>

</body>
</html>
