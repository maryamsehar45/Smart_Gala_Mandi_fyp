<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Gala Mandi - Contact Us</title>

  <!-- CSS (Flask static fix) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- JS -->
  <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="site-header-inner">

      <div class="logo">
        <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Smart Gala Mandi Logo">
        <div class="logo-text">Smart Gala Mandi</div>
      </div>

      <div class="menu-toggle">
        <i class="fas fa-bars"></i>
      </div>

      <nav class="nav">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('about') }}">About Us</a>
        <a href="{{ url_for('contact') }}" class="active">Contact Us</a>
      </nav>

      <div class="header-actions">
        <a href="{{ url_for('login') }}" class="cta-button">Login</a>
        <div class="lang-btn">Eng / اردو</div>
      </div>

    </div>
  </header>

  <!-- ===== CONTACT SECTION ===== -->
  <section class="contact-section">
    <div class="contact-content">

      <!-- IMAGE SIDE -->
      <div class="contact-image">
        <div class="circle"></div>

        <img src="{{ url_for('static', filename='assets/pic.png') }}"
             alt="Contact Smart Gala Mandi">
      </div>

      <!-- FORM SIDE -->
      <div class="contact-text">

        <h2>Contact Us</h2>

        <p>
          Have a question or need support? Smart Gala Mandi is here to help you.
          Whether you’re a farmer, trader, or buyer — we ensure smooth communication
          and assistance at every step.
        </p>

        <!-- FORM (future backend ready) -->
        <form class="contact-form" method="POST" action="{{ url_for('contact') }}">

          <input type="text" name="name" placeholder="Your Name" required>

          <input type="email" name="email" placeholder="Your Email" required>

          <textarea name="message" rows="5" placeholder="Your Message" required></textarea>

          <button type="submit" class="btn">Send Message</button>

        </form>

      </div>

    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="footer-inner">
      <p>© 2025 Smart Gala Mandi | All Rights Reserved</p>
    </div>
  </footer>

</body>
</html>
