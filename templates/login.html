<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>

  <!-- CSS (Flask static fix) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/signup-login.css') }}">
</head>

<body>

  <div class="card">
    <h2>Login</h2>

    <!-- Flask backend POST form -->
    <form id="loginForm" method="POST" action="{{ url_for('login') }}">

      <input id="loginEmail"
             name="email"
             type="email"
             placeholder="Email"
             required>

      <input id="loginPassword"
             name="password"
             type="password"
             placeholder="Password"
             required>

      <div class="row">
        <button type="submit" class="btn btn-success">
          Login
        </button>
      </div>

    </form>

    <p>
      Don't have an account?
      <a href="{{ url_for('signup') }}">Sign Up</a>
    </p>
  </div>

  <!-- JS (Flask static fix) -->
  <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>

</body>
</html>
