<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seller Profile – Smart Galla Mandi</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- Profile CSS -->
  <link rel="stylesheet" href="css/seller-profile.css">
</head>

<body>

<!-- SIDEBAR -->
<nav id="sidebar" class="sidebar p-3">
  
  <div class="mb-4 d-flex align-items-center gap-2">
    <img src="assets/hero.jpg" alt="logo" class="logo-img" />
    <div>
      <div class="h6 mb-0 text-white">SMART GALA MANDI</div>
      <small class="text-white-50">Seller Panel</small>
    </div>
  </div>

  <ul class="nav flex-column">
    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-house me-2"></i>Dashboard</a></li>
    <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-plus me-2"></i>Add Product</a></li>
    <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-list me-2"></i>Manage Listings</a></li>
    <li class="nav-item"><a class="nav-link active" href="profile.html"><i class="fa-solid fa-user me-2"></i>Profile</a></li>
  </ul>

  <div class="mt-auto small text-white-50">© 2025 Smart Gala Mandi</div>

</nav>

<!-- MAIN SECTION -->
<section class="profile-section">

  <div class="profile-container">

    <!-- LEFT: TEXT INFORMATION -->
    <div class="profile-text">
      <h2>My Profile</h2>

      <div class="info-box">
        <p><strong>Name:</strong> Seller</p>
        <p><strong>Email:</strong> seller@example.com</p>
        <p><strong>Phone:</strong> +92 300 1234567</p>
        <p><strong>WhatsApp:</strong> +92 300 1234567</p>
        <p><strong>City:</strong> Okara</p>
      </div>

      <label class="upload-btn mt-3">
        <i class="fa-solid fa-upload me-1"></i> Upload New Picture
        <input type="file" id="uploadPic" accept="image/*">
      </label>
    </div>

    <!-- RIGHT: PROFILE IMAGE -->
    <div class="profile-image">
      <div class="green-circle"></div>
      <img id="profileImage" src="assets/profile.png" alt="Profile">
    </div>

  </div>

</section>

<!-- IMAGE PREVIEW JS -->
<script>
document.getElementById("uploadPic").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (file) {
    document.getElementById("profileImage").src = URL.createObjectURL(file);
  }
});
</script>

</body>
</html>
